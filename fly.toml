app = "lilithlist"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "lilithlist_data"
  destination = "/data"

[env]
  HOST = "0.0.0.0"
  PORT = "4173"
  LILITH_DB = "/data/lilithlist.db"
  NODE_ENV = "production"
  TRUST_PROXY = "1"
